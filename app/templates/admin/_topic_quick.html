<form method="post" action="/admin/students/{{ student.id }}/topics/{{ row.id }}/edit" class="memory-actions"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="version" value="{{ row.version }}">{% if quick_return|default('') in ['card','progress'] %}<input type="hidden" name="return_to" value="{{ quick_return }}">{% endif %}{% if quick_return|default('')=='progress' %}<input type="hidden" name="return_page" value="{{ quick_page }}">{% endif %}<label>Статус<select name="status">{% for key,label in statuses.items() %}<option value="{{ key }}" {% if key==row.status %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><button class="btn secondary">Сохранить статус</button></form>
