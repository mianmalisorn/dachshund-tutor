<dialog id="breathing-panel" class="breathing-panel" aria-labelledby="breathing-title">
<div class="section-head"><h2 id="breathing-title">Минута на подышать</h2><button type="button" class="text-link" data-breathing-close aria-label="Закрыть паузу">Закрыть</button></div>
<p class="muted">Без спешки. Дышите в комфортном ритме — таймер можно остановить в любой момент.</p>

<div class="form-actions"><button type="button" class="btn primary" data-breathing-start>Начать минуту</button><button type="button" class="btn secondary" data-breathing-stop disabled>Остановить</button></div>
</dialog>
